<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1226" />
    <meta name="application-name" content="MAXplorer" />
    <meta name="description" content="MAXplorer - More than just a file manager." />
    <title>MAXplorer</title>
    <script>
      // Bootstrap the persisted theme pair before the first paint so the window
      // never flashes the wrong design or appearance. Mirrors src/lib/theme.ts
      // and src/lib/persistence.ts; invalid values fall back to the defaults.
      (function () {
        try {
          var raw = window.localStorage.getItem("win11-explorer-state-v1");
          var prefs = raw ? JSON.parse(raw) : null;
          var ui = prefs && prefs.interfaceTheme === "finder" ? "finder" : "windows";
          var mode =
            prefs && (prefs.theme === "light" || prefs.theme === "dark") ? prefs.theme : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var appearance = dark ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.uiTheme = ui;
          root.dataset.theme = appearance;
          root.style.colorScheme = appearance;
          var display = (prefs && prefs.display) || {};
          var density = display.density === "compact" ? "compact" : "comfortable";
          var textSize =
            display.textSize === "small" || display.textSize === "large" ? display.textSize : "default";
          var iconSize =
            display.iconSize === "small" || display.iconSize === "large" ? display.iconSize : "default";
          root.dataset.density = density;
          root.dataset.textSize = textSize;
          root.dataset.iconSize = iconSize;
          root.style.setProperty(
            "--ui-text-scale",
            textSize === "small" ? "0.92" : textSize === "large" ? "1.1" : "1",
          );
          root.style.setProperty(
            "--ui-icon-scale",
            iconSize === "small" ? "0.86" : iconSize === "large" ? "1.15" : "1",
          );
        } catch (error) {
          // Storage can be unavailable; the app boots with default tokens.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
