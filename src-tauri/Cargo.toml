[package]
name = "maxplorer"
version = "0.1.0"
description = "MAXplorer - more than just a file manager"
authors = ["MAXplorer contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "maxplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
dirs = "6"
base64 = "0.23"
plist = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
sha2 = "0.10"
walkdir = "2"
flate2 = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
