[package]
name = "maxplorer"
version = "0.2.0"
description = "MAXplorer - more than just a file manager"
authors = ["MAXplorer contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "maxplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
dirs = "6"
base64 = "0.23"
plist = "1.10"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
notify = "8"
sha2 = "0.10"
walkdir = "2"
flate2 = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
librqbit = { version = "8", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
libloading = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Keep unwinding enabled so the panic hook, storage command guard, and indexer
# can record a backtrace and keep the window alive instead of aborting silently.
panic = "unwind"
strip = true
