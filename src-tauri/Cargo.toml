[package]
name = "win11-explorer"
version = "0.1.0"
description = "Windows 11 File Explorer replica for macOS"
authors = ["Explorer Replica"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "win11_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
